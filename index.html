<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pengelola-daftar-tugas-kuliah</title>
  </head>
  <body>
    <div id="app">
      <!-- Form Input Tugas -->
      <form id="task-form">
        <input type="text" id="title" placeholder="Judul tugas..." required />
        <input type="text" id="course" placeholder="Mata kuliah..." required />
        <input type="date" id="deadline" required />
        <button type="submit" id="submit-btn">Tambah Tugas</button>
      </form>

      <!-- Statistik & Filter (Bagian A) -->
      <p id="stats" class="stats"></p>
      <div id="filters" class="filters">
        <button data-filter="Semua">Semua</button>
        <button data-filter="Belum Selesai">Belum Selesai</button>
        <button data-filter="Selesai">Selesai</button>
      </div>

      <!-- Daftar Tugas -->
      <ul id="task-list"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
