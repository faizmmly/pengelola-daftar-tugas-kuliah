<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengelola Daftar Tugas Kuliah</title>
  </head>
  <body>
    <main class="container">
      <header class="app-header">
        <div>
          <h1 id="app-title"></h1>
          <p class="app-subtitle">Kelola tugas kuliah dengan mudah dan terstruktur</p>
        </div>
        <small id="app-version" class="version-badge"></small>
      </header>

      <div id="reminder-banner" class="reminder" role="status" aria-live="polite" hidden></div>

      <!-- Form Input Tugas -->
      <section class="card form-card">
        <h2>Tambah Tugas Baru</h2>
        <form id="task-form">
          <div class="field">
            <label for="title">Judul Tugas</label>
            <input id="title" placeholder="Judul tugas (contoh: Buat Makalah IMK)" required />
          </div>

          <div class="field">
            <label for="course">Mata kuliah</label>
            <input id="course" autocomplete="off" placeholder="Contoh: Interaksi Manusia Komputer" required />
          </div>

          <div class="field">
            <label for="deadline">Deadline</label>
            <input id="deadline" type="date" required />
          </div>

            <button id="submit-btn" type="submit" class="btn-primary">Tambah Tugas</button>
            <button id="cancel-btn" type="button" class="btn-secondary" hidden>Batal Edit</button>
        </form>
      </section>

      <!-- Pencarian & Filter & Statistik -->
      <section class="control-section">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 Cari judul atau mata kuliah..." />
        </div>
        
        <div class="filter-stats-wrapper">
          <p id="stats" class="stats"></p>
          <div id="filters" class="filters">
            <button data-filter="Semua" class="active">Semua</button>
            <button data-filter="Belum Selesai">Belum Selesai</button>
            <button data-filter="Selesai">Selesai</button>
          </div>
        </div>

        <!-- Progress bar (tambahan baru) -->
        <div class="progress" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="stats-detail" class="stats-detail"></div>

        <div class="sort-box">
          <label for="sort-select">Urutkan:</label>
          <select id="sort-select">
            <option value="deadline">Deadline terdekat</option>
            <option value="terbaru">Terbaru ditambahkan</option>
            <option value="nama">Nama (A-Z)</option>
          </select>
        </div>
      </section>

      <!-- Daftar Tugas -->
      <ul id="task-list" class="task-list"></ul>

    <div id="toast" class="toast">Notifikasi</div>

    <script type="module" src="/src/main.ts"></script>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-card">
        <h3>Konfirmasi Hapus</h3>
        <p>Apakah Anda yakin ingin menghapus tugas ini?</p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn-cancel">Batal</button>
          <button id="modal-confirm" class="btn-confirm-danger">Hapus</button>
        </div>
      </div>
    </div>
  </body>
</html>
