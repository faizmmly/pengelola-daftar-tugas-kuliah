<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengelola Daftar Tugas Kuliah</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1 id="app-title"></h1>
        <small id="app-version"></small>
      </header>

      <form id="task-form">
        <input id="title" placeholder="Judul tugas" required />
        <input id="course" placeholder="Mata kuliah" required />
        <input id="deadline" type="date" required />
        <button id="submit-btn" type="submit">Tambah Tugas</button>
      </form>

      <ul id="task-list"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
